# RUNUT Simple Zero-Cost Persistent Backend Blueprint (Academic / Demo / Limited Testing)
# Architecture (Zero Credit Card Required):
#   Frontend + Same-Origin Proxy : Cloudflare Pages Free + Pages Functions (functions/api/[[path]].js)
#   Backend API + LibreOffice    : Render Free Web Service (Docker, Node.js 24, 512 MB RAM)
#   Database + Document Storage  : Neon Free PostgreSQL (external, non-expiring, TLS, BYTEA w/ 700 MB / 4 GB app safety limits)
#   Optional Object Storage      : Cloudflare R2 (OBJECT_STORAGE_PROVIDER=r2) or Oracle OCI (OBJECT_STORAGE_PROVIDER=oci)
services:
  - type: web
    name: runut-web
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: "lax"
      - key: COOKIE_SECURE
        value: "true"
      - key: OBJECT_STORAGE_PROVIDER
        value: "postgres"
      - key: STRICT_STORAGE_QUOTA_MODE
        value: "true"
      - key: MAX_CONCURRENT_CONVERSIONS
        value: "1"
      - key: MAX_CONVERSION_QUEUE
        value: "4"
      - key: CONVERSION_MAX_RSS_MB
        value: "380"
      - key: DOCX_PDF_TIMEOUT_MS
        value: "90000"
      - key: ADMIN_EMAILS
        sync: false
      - key: AI_PROVIDER
        value: openrouter
      - key: STRICT_FREE_AI_ONLY
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: particle-ai/particle-1:free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DOCX_PDF_CONVERSION_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SECURE
        value: "false"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
